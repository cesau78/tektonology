name: Services — Test & Coverage

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/services-test.yml"
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/services-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [queue, printing-agent, accounting-agent]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        working-directory: services/${{ matrix.service }}

      - name: Run tests with coverage
        id: coverage
        run: |
          npm run test:coverage 2>&1 | tee coverage-output.txt
          # Extract source file lines (skip test files and header/footer lines)
          # Source lines look like: # lib.js      | 100.00 |   100.00 |  100.00 |
          grep -E '^\#\s+\S+\.js\s+\|' coverage-output.txt | grep -v '\.test\.js' > source-coverage.txt || true

          if [ ! -s source-coverage.txt ]; then
            echo "::error::No source coverage data found"
            exit 1
          fi

          FAILED=0
          while IFS= read -r line; do
            FILE=$(echo "$line" | awk -F'|' '{gsub(/^# *| *$/, "", $1); print $1}')
            LINE_PCT=$(echo "$line" | awk -F'|' '{gsub(/ /, "", $2); print $2}')
            BRANCH_PCT=$(echo "$line" | awk -F'|' '{gsub(/ /, "", $3); print $3}')
            FUNC_PCT=$(echo "$line" | awk -F'|' '{gsub(/ /, "", $4); print $4}')

            echo "  $FILE — line: $LINE_PCT% branch: $BRANCH_PCT% funcs: $FUNC_PCT%"

            for PCT in "$LINE_PCT" "$BRANCH_PCT" "$FUNC_PCT"; do
              if [ "$PCT" != "100.00" ]; then
                echo "::error::$FILE has coverage below 100% (line: $LINE_PCT%, branch: $BRANCH_PCT%, funcs: $FUNC_PCT%)"
                FAILED=1
              fi
            done
          done < source-coverage.txt

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "All source files at 100% coverage"
        working-directory: services/${{ matrix.service }}
