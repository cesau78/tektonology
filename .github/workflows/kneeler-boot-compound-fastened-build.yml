# Ordered build: (1) stamp sync + prototype STL export (preview, $fn=32), (2) smoke render,
# (3) production STL export ($fn=128). Push to main runs all three; production STLs are committed
# when they change.

name: Kneeler boot compound fastened — build

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
    paths:
      - "3d-models/prayer-sole/v3-compound-fastened/**"
      - ".github/workflows/kneeler-boot-compound-fastened-build.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: true
        type: string
        default: "main"
      run_production_export:
        description: "After prototype export, run production STL export (latest-builds/<version>/, no Prototype stamp)"
        required: true
        type: boolean
        default: true
      verify_product_version:
        description: "Optional — fail production step unless stamp-config.json product_version equals this (e.g. v3.8.1)"
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install OpenSCAD and jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openscad jq

      - name: Stamp sync and prototype STL export
        working-directory: 3d-models/prayer-sole/v3-compound-fastened
        run: |
          chmod +x scripts/export-open-scad-stl.sh
          ./scripts/export-open-scad-stl.sh

      - name: Validate coupler (smoke render)
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/3d-models/prayer-sole/v3-compound-fastened/.ci-validation"
          mkdir -p "$OUT_DIR"
          openscad -o "$OUT_DIR/coupler.png" --imgsize=640,480 --autocenter --viewall \
            -D "preview=true" -D "crosssection_view=false" \
            "$GITHUB_WORKSPACE/3d-models/prayer-sole/v3-compound-fastened/coupler.scad"

      - name: Verify product_version (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.run_production_export && inputs.verify_product_version != ''
        working-directory: 3d-models/prayer-sole/v3-compound-fastened
        run: |
          cfg="$(jq -r '.product_version' stamp-config.json | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          want="$(echo "${{ inputs.verify_product_version }}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ "$cfg" != "$want" ]]; then
            echo "::error::stamp-config.json has product_version='$cfg', expected '$want'"
            exit 1
          fi
          echo "product_version matches: $cfg"

      - name: Production STL export
        if: >-
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.run_production_export)
        working-directory: 3d-models/prayer-sole/v3-compound-fastened
        env:
          KBCF_PRODUCTION: "1"
        run: |
          chmod +x scripts/export-open-scad-stl.sh
          ./scripts/export-open-scad-stl.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kneeler-boot-compound-fastened-build
          path: |
            3d-models/prayer-sole/v3-compound-fastened/latest-builds/**/*.stl
            3d-models/prayer-sole/v3-compound-fastened/latest-builds/**/*.md
            3d-models/prayer-sole/v3-compound-fastened/.ci-validation/coupler.png
            3d-models/prayer-sole/v3-compound-fastened/stamp-generated.scad

      - name: Commit and push production builds
        if: >-
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.run_production_export)
        working-directory: 3d-models/prayer-sole/v3-compound-fastened
        env:
          PUSH_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VER="$(jq -r '.product_version' stamp-config.json | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          git add "latest-builds/$VER/"
          if git diff --cached --quiet; then
            echo "No production STL changes to commit."
          else
            git commit -m "build: production STLs for $VER [skip ci]"
            git push origin "HEAD:refs/heads/$PUSH_REF"
          fi
